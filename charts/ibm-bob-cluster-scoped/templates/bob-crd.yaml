---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: bobs.bob.ibm.com
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: ibm-bob
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  group: bob.ibm.com
  names:
    kind: Bob
    listKind: BobList
    plural: bobs
    singular: bob
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=='Available')].status
          name: Ready
          type: string
        - jsonPath: .status.conditions[?(@.type=='Available')].message
          name: Message
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1beta1
      schema:
        openAPIV3Schema:
          description: Bob is the Schema for the bobs API
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: spec defines the desired state of Bob
              properties:
                blockStorageClass:
                  description: blockStorageClass defines the storage class for block storage
                  type: string
                externalCertificate:
                  description: externalCertificate configures the external (customer-facing) TLS certificate
                  properties:
                    secretName:
                      description: |-
                        secretName is the name of an existing kubernetes.io/tls Secret in the same namespace.
                        When set, cert-manager is not used for the external certificate.
                      minLength: 1
                      type: string
                  type: object
                fileStorageClass:
                  description: fileStorageClass defines the storage class for file storage
                  type: string
                imagePullPrefix:
                  default: icr.io
                  description: imagePullPrefix defines the image registry prefix
                  type: string
                imagePullSecret:
                  default: ibm-entitlement-key
                  description: imagePullSecret defines the image pull secret name
                  type: string
                postgresImage:
                  description: postgresImage defines the postgres container image to use
                  type: string
                rag:
                  description: rag configures the optional RAG workload (restore Job + MCP Server).
                  properties:
                    enabled:
                      default: false
                      description: enabled controls whether the RAG stack (restore Job + MCP Server) is deployed.
                      type: boolean
                  type: object
                shutdown:
                  default: false
                  description: shutdown controls hibernation of the Bob database
                  type: boolean
                zProxy:
                  description: zProxy configures the optional zProxy workload.
                  properties:
                    enabled:
                      default: false
                      description: enabled controls whether the zProxy/Z RAG stack (zProxy + hash + zlookup mcp) is deployed.
                      type: boolean
                    hashApiSecretKeyName:
                      description: |-
                        hashApiSecretKeyName is the file name (key) inside the hash-API secret
                        that holds the encryption key material.
                      type: string
                    hashApiSecretName:
                      description: |-
                        hashApiSecretName is the name of the Kubernetes Secret that holds the
                        hash API encryption key. The zProxy Deployment is only created when this
                        secret exists; it is deleted when the secret is absent.
                      type: string
                  required:
                    - hashApiSecretKeyName
                    - hashApiSecretName
                  type: object
              required:
                - blockStorageClass
                - fileStorageClass
                - imagePullSecret
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              description: status defines the observed state of Bob
              properties:
                conditions:
                  description: |-
                    conditions represent the current state of the Bob resource.
                    Each condition has a unique type and reflects the status of a specific aspect of the resource.

                    Standard condition types include:
                    - "Available": the resource is fully functional
                    - "Progressing": the resource is being created or updated
                    - "Degraded": the resource failed to reach or maintain its desired state

                    The status of each condition is one of True, False, or Unknown.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                rag:
                  description: rag reflects the observed state of the RAG workload.
                  properties:
                    message:
                      type: string
                    phase:
                      type: string
                    snapshotVersion:
                      type: string
                  type: object
                zProxy:
                  description: zProxy reflects the observed state of the zProxy workload.
                  properties:
                    status:
                      description: |-
                        Status is a short machine-readable summary of the zProxy installation
                        state. The controller sets it to one of the well-known constants defined
                        in this package (e.g. [StatusReady], [StatusDisabled]) after every
                        reconcile pass. Consumers should treat "" (empty) as unknown — the
                        controller has not yet completed a pass for this resource.
                      type: string
                    zLookupURL:
                      description: |-
                        ZLookupURL is the in-cluster HTTPS URL of the zLookup service.
                        It is set to the Service endpoint once the zProxy resources have been
                        successfully reconciled, and cleared whenever zProxy is disabled or an
                        error occurs.
                        Format: https://<service>.<namespace>.svc.cluster.local:<port>
                        Example: "https://my-bob-zproxy.bob.svc.cluster.local:8083"
                      type: string
                    zProxyURL:
                      description: |-
                        ZProxyURL is the in-cluster HTTPS URL of the zProxy service.
                        It is set to the Service endpoint once the zProxy resources have been
                        successfully reconciled, and cleared whenever zProxy is disabled or an
                        error occurs.
                        Format: https://<service>.<namespace>.svc.cluster.local:<port>
                        Example: "https://my-bob-zproxy.bob.svc.cluster.local:8081"
                      type: string
                  type: object
              type: object
          required:
            - spec
          type: object
          x-kubernetes-validations:
            - message: zProxy requires RAG to be enabled (spec.rag.enabled must be true when spec.zProxy.enabled is true)
              rule: '!has(self.spec.zProxy) || !self.spec.zProxy.enabled || (has(self.spec.rag) && self.spec.rag.enabled)'
      served: true
      storage: true
      subresources:
        status: {}
