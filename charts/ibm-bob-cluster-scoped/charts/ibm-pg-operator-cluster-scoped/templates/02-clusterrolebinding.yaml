apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    component-id: '{{ .Chart.Name }}'
    icpdsupport/addOnId: ibm-pg-operator
    icpdsupport/app: database
    icpdsupport/module: ibm-pg-operator
  name: ibm-pg-operator-rolebinding-{{ .Values.global.operatorNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ibm-pg-operator-{{ .Values.global.operatorNamespace }}
subjects:
- kind: ServiceAccount
  name: ibm-pg-operator
  namespace: '{{ .Values.global.operatorNamespace }}'
