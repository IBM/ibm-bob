apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rediscps.redis.ibm.com-v1-{{ .Values.global.operatorNamespace }}-edit
  labels:
    component-id: {{ .Chart.Name }}
    icpdsupport/addOnId: ibm-redis-cp
    rbac.authorization.k8s.io/aggregate-to-edit: 'true'
rules:
  - apiGroups:
    - redis.ibm.com
    resources:
    - rediscps
    verbs:
    - get
    - create
    - update
    - patch
    - delete
