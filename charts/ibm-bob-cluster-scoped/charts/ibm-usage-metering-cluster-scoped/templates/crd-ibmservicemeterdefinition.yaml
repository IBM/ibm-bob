---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.1
  name: ibmservicemeterdefinitions.operator.ibm.com
  labels:
    component-id: {{ .Chart.Name }}
spec:
  group: operator.ibm.com
  names:
    kind: IBMServiceMeterDefinition
    listKind: IBMServiceMeterDefinitionList
    plural: ibmservicemeterdefinitions
    singular: ibmservicemeterdefinition
  scope: Namespaced
  versions:
    - name: v1
      schema:
        openAPIV3Schema:
          description: IBM Service Meter Definition is the Schema for the ibmservicemeterdefinitions API
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: IBMServiceMeterDefinitionSpec defines the desired state of IBMServiceMeterDefinition
              properties:
                breakdownDefs:
                  description: |-
                    Optional pivot definitions to apply to JSON payloads from the endpoints. Each definition will be used for
                    breaking down the usage into different groups/tenants. Each definition describes a breakdown that will be
                    added as additional one to the breakdowns provided explicitly in the JSON payloads.
                    Defaults to null value which means no additional breakdown is computed.
                  items:
                    description: Pivot definition which will be used for breaking down the usage into different groups/tenants.
                    properties:
                      breakdownBy:
                        description: Type of the breakdown groups/tenants provided by the pivot definition.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      groupBy:
                        description: |-
                          Array of the attributes from the JSON payload to use as a (potentially multidimensional)
                          grouping key that represents the breakdown group/tenant.
                        items:
                          description: |-
                            Attribute from the JSON payload that takes part in constituting a (potentially multidimensional) grouping key
                            that represents the breakdown group/tenant.
                          pattern: ^.{1,255}$
                          type: string
                        type: array
                      processing:
                        description: |-
                          Optional aggregation processing within the same breakdown group/tenant represented by the specific
                          breakdown group/tenant. If processing is 'COUNT', then it means that the number of JSON payloads
                          is counted for each grouping key (payloads with the same values for the grouping key will be grouped
                          together and the amount of those payloads will be reported as the key's breakdown value). If processing is 'ADD',
                          then it means that the values reported in the attribute specified in the source field of JSON payloads
                          will be added up for each grouping key (payloads with the same values for the grouping key will be
                          grouped together and the sum of the values of attribute specified in the source field will be
                          reported as the key's breakdown value). If processing is 'MAX', then it means that the greatest value reported
                          in the attribute specified in the source field of JSON payloads will be set for each grouping key
                          (payloads with the same values for the grouping key will be grouped together and the greatest value will be reported
                          as the key's breakdown value). If processing is 'LAST', then it means that the latest received value from
                          values reported in the attribute specified in the source field of JSON payloads will be set for each grouping key
                          (payloads with the same values for the grouping key will be grouped together and the value that was
                          received later will be reported as the key's breakdown value). Defaults to processing selected in data section.
                        type: string
                      source:
                        description: |-
                          Attribute from the JSON payload that is being aggregated based on the grouping key that
                          represents the breakdown group/tenant - this field is required if value of processing field is other than 'COUNT'.
                        pattern: ^.{1,255}$
                        type: string
                    required:
                      - breakdownBy
                      - groupBy
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  type: array
                contexts:
                  description: |-
                    Context metrics included in the breakdown for additional context but excluded from the calculation
                    defined by the method field. Unlike sources, which feed into the computation of the new metric,
                    context metrics are purely informational and not used to derive the final value.
                  items:
                    description: |-
                      Context metric details to include in the metric breakdown when calculating the new metric.
                      These fields are included purely as metadata (context) and are not used to compute derived metrics.
                    properties:
                      instanceId:
                        description: |-
                          Optional instance ID which uniquely idetifies the instance of the installed product.
                          Defaults to the namespace in which Usage Metering Service is installed.
                        pattern: ^[a-zA-Z0-9-]{1,255}$
                        type: string
                      metricName:
                        description: |-
                          Name of the metric to include in the metric breakdown.
                          Defaults to the metric name defined in the data section of the CR/payload.
                        pattern: ^.{1,255}$
                        type: string
                      productId:
                        description: |-
                          Product ID obtained by the product when going through the Readiness process, to include in the metric breakdown.
                          Defaults to the product ID defined in the data section of the CR/payload.
                        pattern: ^$|^[0-9a-fA-F]{1,32}$
                        type: string
                      productName:
                        description: |-
                          Product name corresponding to the productId field.
                          Defaults to the product name defined in the data section of the CR/payload.
                        pattern: ^.{1,255}$
                        type: string
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  type: array
                data:
                  description: |-
                    The data field provides the values received by the metering framework that will be then augmented
                    with the static (product-defined) values coming from the CR.
                  properties:
                    breakdowns:
                      description: Array of the usage metric breakdowns.
                      items:
                        description: Usage metric breakdown.
                        properties:
                          breakdownBy:
                            description: |-
                              Type of the breakdown groups/tenants provided in the metricBreakdown array -
                              this field is required if metricBreakdown is provided.
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          metricBreakdown:
                            description: Optional breakdown on certain groups/tenants.
                            items:
                              description: Array of breakdown quantities for certain groups/tenants.
                              properties:
                                group:
                                  description: Breakdown group/tenant (potentially multidimensional) grouping key.
                                  type: object
                                  x-kubernetes-preserve-unknown-fields: true
                                metricQuantity:
                                  description: |-
                                    Breakdown quantity for the specific group/tenant.
                                    It needs to be provided by JSON payload if not defined in the CR and processing is not set to COUNT.
                                  format: int64
                                  maximum: 999999999
                                  minimum: 0
                                  type: integer
                              required:
                                - group
                                - metricQuantity
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                            type: array
                          processing:
                            description: |-
                              Optional aggregation processing within the same breakdown group/tenant represented by the specific
                              breakdown group/tenant. If processing is 'COUNT', then it means that the number of JSON payloads
                              is counted for each grouping key (payloads with the same values for the grouping key will be grouped
                              together and the amount of those payloads will be reported as the key's breakdown value). If processing is 'ADD',
                              then it means that the values reported in the attribute specified in the source field of JSON payloads
                              will be added up for each grouping key (payloads with the same values for the grouping key will be
                              grouped together and the sum of the values of attribute specified in the source field will be
                              reported as the key's breakdown value). If processing is 'MAX', then it means that the greatest value reported
                              in the attribute specified in the source field of JSON payloads will be set for each grouping key
                              (payloads with the same values for the grouping key will be grouped together and the greatest value will be reported
                              as the key's breakdown value). If processing is 'LAST', then it means that the latest received value from
                              values reported in the attribute specified in the source field of JSON payloads will be set for each grouping key
                              (payloads with the same values for the grouping key will be grouped together and the value that was
                              received later will be reported as the key's breakdown value). Defaults to processing selected in data section.
                            type: string
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      type: array
                    instanceId:
                      description: |-
                        Optional instance ID which uniquely idetifies the instance of the installed product.
                        Defaults to the namespace in which Usage Metering Service is installed.
                      pattern: ^[a-zA-Z0-9-]{1,255}$
                      type: string
                    metricDescription:
                      description: Optional description of the metric provided in the metricName field. Defaults to metricName field.
                      pattern: ^.{1,1000}$
                      type: string
                    metricName:
                      description: |-
                        Name of the metric, for which this payload provides the measurement.
                        It needs to be provided by JSON payload if not defined in the CR.
                      pattern: ^.{1,255}$
                      type: string
                    metricQuantity:
                      description: |-
                        Measured quantity of the metric provided in the metricName field.
                        It needs to be provided by JSON payload if not defined in the CR and processing is not set to COUNT.
                      format: int64
                      maximum: 999999999
                      minimum: 0
                      type: integer
                    metricType:
                      description: |-
                        Type of the metric provided in the metricName field. If type is 'ADOPTION', then it means that the
                        metric is used ony for the purpose of tracking to what extent the product is being used which might
                        give information about usefulness of the product If type is 'CONTRACTUAL', then it means that the
                        metric is used for the purpose of product licensing. Defaults to 'ADOPTION'.
                      type: string
                    productId:
                      description: Product ID obtained from the Readiness. It needs to be provided by JSON payload if not defined in the CR.
                      pattern: ^$|^[0-9a-fA-F]{1,32}$
                      type: string
                    productName:
                      description: Product name obtained from the Readiness. It needs to be provided by JSON payload if not defined in the CR.
                      pattern: ^.{1,255}$
                      type: string
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                mappingId:
                  description: |-
                    Mapping key used for augmenting JSON payload with the static data provided by the CR.
                    If the mappingId is provided, the payload is merged with the data defined
                    in the CR with the corresponding mappingId (CR data takes precedence).
                    If the (potentially modified by the CR) payload follows the specific format,
                    then the additional processing is applied (some level of persistency is added).
                    In any case, the raw data is passed-through to the IBM Software Central.
                    Different mappingIds reporting the same metric for the same component should
                    define consistent processing, otherwise the payload with processing different than already
                    received previously will be treated as invalid and not processed.
                    The component is identified by (instanceId, productId) pair.
                    If mappingId is provided, then method field and sources section should not be defined.
                    If mappingId is not provided, the metrics is not being reported by a component,
                    but rather it's being calculated based on other metrics reported to UMS. In such case,
                    method field and sources section needs to be specified.
                  pattern: ^[a-zA-Z0-9_-]{1,128}$
                  type: string
                method:
                  description: |-
                    Optional method for calculating a new metric based on other metrics present in UMS.
                    If this field is set, the mappingId field must not be provided, and the sources section must be specified.
                    Supported methods:
                      - "RATIO_SUM": sums all metrics referenced in the sources section, applying the specified ratios.
                      - "RATIO_SUM_STEPWISE": performs a stepwise ratio-based summation of the referenced metrics.
                    Defaults to "RATIO_SUM" if not specified.
                  type: string
                processing:
                  description: |-
                    Depending on the processing field the stored value is updated as follows: if processing is 'ADD',
                    then the currently received value is added to the stored value, if processing is 'LAST',
                    then the currently received value overrides the stored value, if processing is 'MAX',
                    then the currently received value overrides the stored value only in case the stored value
                    is lower and if processing is 'COUNT' then the currently received value is ignored and
                    the stored value is incremented by one. If the value is broken down into groups/tenants, currently
                    received value and the stored value are compared for each group/tenant independently. Defaults to 'MAX'.
                  type: string
                sources:
                  description: |-
                    The sources section define the metrics based on which to calculate the new metric according
                    to the rules defined by the method field.
                  items:
                    description: Source metric details to use when calculating the new metric.
                    properties:
                      instanceId:
                        description: |-
                          Optional instance ID which uniquely idetifies the instance of the installed product.
                          Defaults to the namespace in which Usage Metering Service is installed.
                        pattern: ^[a-zA-Z0-9-]{1,255}$
                        type: string
                      metricName:
                        description: |-
                          Name of the metric based on which the new metric is being calculated.
                          Defaults to the metric name defined in the data section of the CR/payload.
                        pattern: ^.{1,255}$
                        type: string
                      parameters:
                        additionalProperties:
                          description: Parameter name used in the algorithm to calculate new metric based on the algorithm sepcified in the method field.
                          pattern: ^.{1,255}$
                          type: string
                        description: Parameters needed for the algorithm used in calculation of the new metric defined by the method field.
                        type: object
                      productId:
                        description: |-
                          Product ID obtained by the product when going through the Readiness process,
                          based on which the new metric is calculated.
                          Defaults to the product ID defined in the data section of the CR/payload.
                        pattern: ^$|^[0-9a-fA-F]{1,32}$
                        type: string
                      productName:
                        description: |-
                          Product name corresponding to the productId field.
                          Defaults to the product name defined in the data section of the CR/payload.
                        pattern: ^.{1,255}$
                        type: string
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  type: array
              type: object
              x-kubernetes-preserve-unknown-fields: true
              x-kubernetes-validations:
                - message: cannot specify mappingId together with method or sources
                  rule: (!has(self.mappingId) || self.mappingId == "") || ((!has(self.method) || self.method == "") && (!has(self.sources) || size(self.sources) == 0))
                - message: must specify either mappingId or sources
                  rule: (has(self.mappingId) && self.mappingId != "") || (has(self.sources) && size(self.sources) > 0)
                - message: sources are required when method is specified
                  rule: (!has(self.method) || self.method == "") || (has(self.sources) && size(self.sources) > 0)
                - message: breakdownDefs must not be provided when mappingId is not specified
                  rule: (has(self.mappingId) && self.mappingId != "") || (!has(self.breakdownDefs) || size(self.breakdownDefs) == 0)
            status:
              description: IBMServiceMeterDefinitionStatus defines the observed state of IBMServiceMeterDefinition
              type: object
              x-kubernetes-preserve-unknown-fields: true
          required:
            - spec
          type: object
          x-kubernetes-validations:
            - message: please provide a valid spec section
              rule: has(self.spec)
      served: true
      storage: true
      subresources:
        status: {}
