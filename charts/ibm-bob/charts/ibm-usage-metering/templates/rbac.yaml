{{- if eq (lower (.Values.ibmUsageMetering.createRBAC | toString)) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: ibm-usage-metering-operator
    component-id: {{ .Chart.Name }}
  name: ibm-usage-metering-leader-election
  namespace: {{ .Values.global.operatorNamespace | default .Release.Namespace  }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ibm-usage-metering-operator
  namespace: {{ .Values.global.instanceNamespace | default .Release.Namespace  }}
  labels:
    component-id: {{ .Chart.Name }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
      - serviceaccounts
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - operator.ibm.com
    resources:
      - ibmservicemeterdefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - operator.ibm.com
    resources:
      - ibmusagemeterings
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - operator.ibm.com
    resources:
      - ibmusagemeterings/finalizers
    verbs:
      - update
  - apiGroups:
      - operator.ibm.com
    resources:
      - ibmusagemeterings/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
      - roles
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
{{- if .Values.ibmUsageMetering.enableRoutes }}
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: ibm-usage-metering-operator
    component-id: {{ .Chart.Name }}
  name: ibm-usage-metering-leader-election
  namespace: {{ .Values.global.operatorNamespace | default .Release.Namespace  }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ibm-usage-metering-leader-election
subjects:
  - kind: ServiceAccount
    name: ibm-usage-metering-operator
    namespace: {{ .Values.global.operatorNamespace | default .Release.Namespace  }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: ibm-usage-metering-operator
    component-id: {{ .Chart.Name }}
  name: ibm-usage-metering-operator
  namespace: {{ .Values.global.instanceNamespace | default .Release.Namespace  }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ibm-usage-metering-operator
subjects:
  - kind: ServiceAccount
    name: ibm-usage-metering-operator
    namespace: {{ .Values.global.operatorNamespace | default .Release.Namespace  }}
{{- end }}
