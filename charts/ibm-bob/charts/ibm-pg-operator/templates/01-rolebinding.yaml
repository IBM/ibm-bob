{{- $watchNamespaces := $.Values.global.tetheredNamespaces | default list -}}
{{- if $.Values.global.instanceNamespace -}}
  {{- $watchNamespaces = append $watchNamespaces $.Values.global.instanceNamespace -}}
{{- end -}}
{{- $watchNamespaces = prepend $watchNamespaces $.Values.global.operatorNamespace }}
{{- range $namespace := uniq $watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    component-id: '{{ $.Chart.Name }}'
    icpdsupport/addOnId: ibm-pg-operator
    icpdsupport/app: database
    icpdsupport/module: ibm-pg-operator
  name: ibm-pg-operator-rolebinding
  namespace: '{{ $namespace }}'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ibm-pg-operator
subjects:
- kind: ServiceAccount
  name: ibm-pg-operator
  namespace: '{{ $.Values.global.operatorNamespace }}'

{{- end }}
