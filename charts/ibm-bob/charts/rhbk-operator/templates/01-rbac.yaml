{{- $watchNamespaces := include "rhbkOperator.watchNamespaces" $ | fromYamlArray | uniq -}}
{{- range $namespace := $watchNamespaces }}
{{- range $.Values.rhbkOperator.permissions }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
{{ include "rhbkOperator.labels" $ | indent 4 }}
  name: '{{ .serviceAccountName }}'
  namespace: '{{ $namespace }}'
rules:
{{- toYaml .rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
{{ include "rhbkOperator.labels" $ | indent 4 }}
  name: '{{ .serviceAccountName }}'
  namespace: '{{ $namespace }}'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: '{{ .serviceAccountName }}'
subjects:
- kind: ServiceAccount
  name: '{{ .serviceAccountName }}'
  namespace: '{{ $.Values.global.operatorNamespace }}'
{{- end -}}
{{- end -}}
