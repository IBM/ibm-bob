---
apiVersion: v2
name: ibm-bob
description: "A Helm chart to deploy IBM Bob, your AI-powered development partner"
type: application
icon: data:image/svg+xml;base64,
version: 1.0.0
appVersion: 1.0.0-0
kubeVersion: ">= 1.33"
home: https://bob.ibm.com
annotations:
  operatorVersion: 0.11.0
  charts.openshift.io/name: IBM Bob
  charts.openshift.io/provider: IBM
maintainers:
  - name: IBM
dependencies:
  - name: ibm-usage-metering
    version: "1.0.6"
    repository: "file://charts/ibm-usage-metering"
    condition: ibm-usage-metering.enabled
  - name: ibm-pg-operator
    version: "28.4.3"
    repository: "file://charts/ibm-pg-operator"
    condition: ibm-pg-operator.enabled
  - name: ibm-redis-cp
    version: "1.3.1"
    repository: "file://charts/ibm-redis-cp"
    condition: ibm-redis-cp.enabled
  - name: opencontent-opensearch
    version: "1.4.5"
    repository: "file://charts/opencontent-opensearch"
    condition: opencontent-opensearch.enabled
  - name: rhbk-operator
    version: "26.6.4"
    repository: "file://charts/rhbk-operator"
    condition: rhbk-operator.enabled
