---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ibm-bob-role
  namespace: {{ .Values.global.instanceNamespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: ibm-bob
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - persistentvolumeclaims
      - secrets
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - bob.ibm.com
    resources:
      - bobldaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - bob.ibm.com
    resources:
      - bobldaps/status
      - bobs/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - bob.ibm.com
    resources:
      - bobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - bob.ibm.com
    resources:
      - bobs/finalizers
    verbs:
      - update
  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
      - issuers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - k8s.keycloak.org
    resources:
      - keycloaks
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - k8s.keycloak.org
    resources:
      - keycloaks/status
    verbs:
      - get
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - opensearch.cloudpackopen.ibm.com
      - pg.ibm.com
    resources:
      - clusters
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - opensearch.cloudpackopen.ibm.com
      - pg.ibm.com
    resources:
      - clusters/status
    verbs:
      - get
  - apiGroups:
      - redis.ibm.com
    resources:
      - rediscps
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
